name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: sh -n scripts/migrate.sh
      - run: docker build -t tg-aibot:test .
      # Exercise the real Linux/musl CLI installation as the unprivileged app user.
      # Model generation has external free-tier quotas, so CI checks installation and catalog only.
      - name: OpenCode Linux container smoke test
        run: |
          # Match Compose's writable data volume, including its app ownership.
          # --rm removes this anonymous volume when the smoke container exits.
          docker run --rm --read-only --init \
            --mount type=volume,dst=/app/data \
            --tmpfs /tmp:rw,size=512m \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DATA_DIR=/app/data \
            --entrypoint sh tg-aibot:test -c '
              npm run opencode:smoke && exit 0
              for log in /app/data/opencode/npm-cache/_logs/*-debug-0.log; do
                if [ -f "$log" ]; then tail -n 80 "$log"; fi
              done
              exit 1
            '
