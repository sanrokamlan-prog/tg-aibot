services:
  tg-ai-bot:
    build: .
    container_name: tg-ai-bot
    restart: always
    init: true
    read_only: true
    env_file:
      - .env
    volumes:
      - tg-ai-bot-data:/app/data
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100
    stop_grace_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tg-ai-bot-data:
